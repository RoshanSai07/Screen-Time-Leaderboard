<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Time Awareness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="leaderboard">
      <h2>Screen Time</h2>
      <button class="clear-all-btn" onclick="clearAllData()">Clear All</button>

      <div class="entries" id="entries-container"></div>
      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="total-count">0</div>
          <div class="stat-label">Participants</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="average-time">0</div>
          <div class="stat-label">Avg Hours</div>
        </div>
      </div>
    </div>

    <div class="right-section">
      <div class="hook">
        <h1>6.5 hours daily. 99 days yearly.</h1>
        <p>
          Students spend nearly 100 days per year on screens. How does your
          usage compare? Join our visualization and see where you fit in the
          digital landscape.
        </p>
      </div>

      <div class="form-section">
        <h3>Add your screen time</h3>
        <form id="screenTimeForm">
          <div class="form-group">
            <div class="input-group">
              <label>Your name</label>
              <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
              />
            </div>
            <div class="input-group">
              <label>Daily screen time (hours)</label>
              <input
                type="number"
                id="hours"
                min="0"
                max="24"
                step="0.1"
                placeholder="e.g., 4.5"
                required
              />
            </div>
            <button type="submit" class="btn">Add</button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
